[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-layer-nl-analytics"
version = "0.1.0"
description = "CS 5130: Evaluating Semantic Layers for Reliable Natural-Language Analytics"
requires-python = ">=3.11"
dependencies = ["duckdb==1.4.3", "pyarrow==22.0.0", "pydantic==2.12.5", "PyYAML==6.0.3", "sqlglot==28.10.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the frozen real TLC dataset"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
